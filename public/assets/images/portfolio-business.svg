<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#172A45"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="#F1F5F9" rx="16"/>

  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="350" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
  
  <!-- Browser Header Bar -->
  <path d="M 25 37 Q 25 25 37 25 L 563 25 Q 575 25 575 37 L 575 58 L 25 58 Z" fill="#0A192F"/>
  <circle cx="45" cy="42" r="4.5" fill="#EF4444"/>
  <circle cx="58" cy="42" r="4.5" fill="#F59E0B"/>
  <circle cx="71" cy="42" r="4.5" fill="#10B981"/>
  
  <!-- URL Bar -->
  <rect x="95" y="34" width="300" height="16" rx="8" fill="#1E293B"/>
  <text x="110" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#94A3B8">https://kathmandulogistics.com.np</text>

  <!-- Website Content Preview -->
  <!-- Navigation -->
  <rect x="45" y="75" width="70" height="14" rx="4" fill="#0A192F"/>
