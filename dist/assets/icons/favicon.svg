<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#028090"/>
    </linearGradient>
  </defs>
  <!-- Background Circle for contrast -->
  <circle cx="32" cy="32" r="30" fill="#0A192F" />
  
  <!-- Sun Rays (Golden & Teal) -->
  <!-- Center of dome at (28, 40) -->
  <line x1="28" y1="20" x2="28" y2="13" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="17" y2="17" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="28" x2="10" y2="26" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="35" x2="8" y2="36" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="22" x2="39" y2="17" stroke="#00A896" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="27" x2="44" y2="23" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Navy/Teal Half-Sun Dome -->
  <path d="M 17 38 A 11 11 0 0 1 39 38 Z" fill="#028090" />
  
  <!-- Growth Node Line & Arrow -->
  <circle cx="37" cy="30" r="2.5" fill="#00A896" />
  <line x1="37" y1="30" x2="43" y2="30" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round" />
  <line x1="43" y1="30" x2="47" y2="24" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="47" cy="24" r="2.5" fill="#00A896" />
  <line x1="47" y1="24" x2="52" y2="24" stroke="#F5A623" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="52" cy="24" r="2.5" fill="#F5A623" />

  <!-- Upward swooping curve with arrow -->
  <path d="M 13 46 Q 30 46 41 38 T 53 23" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" />
  <polygon points="54,19 47,24 53,27" fill="#F5A623" transform="rotate(35 52 23)" />
</svg>
