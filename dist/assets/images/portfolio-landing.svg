<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="promoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <filter id="shadowP3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#F1F5F9" rx="16"/>

  <!-- Browser Frame -->
  <rect x="25" y="25" width="550" height="350" rx="12" fill="#FFFFFF" filter="url(#shadowP3)"/>
  
  <!-- Header Bar -->
  <path d="M 25 37 Q 25 25 37 25 L 563 25 Q 575 25 575 37 L 575 58 L 25 58 Z" fill="#0A192F"/>
  <circle cx="45" cy="42" r="4.5" fill="#EF4444"/>
  <circle cx="58" cy="42" r="4.5" fill="#F59E0B"/>
  <circle cx="71" cy="42" r="4.5" fill="#10B981"/>
  <rect x="95" y="34" width="280" height="16" rx="8" fill="#1E293B"/>
  <text x="110" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#94A3B8">https://himalayancraft.com.np/festivesale</text>

  <!-- Banner / Promo Strip -->
  <rect x="45" y="70" width="510" height="24" fill="#F5A623" rx="4"/>
  <text x="200" y="86" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0A192F">🎉 Limited Dashain Festival Offer - Free Shipping across Nepal!</text>

  <!-- Split Landing Hero -->
  <g transform="translate(45, 105)">
    <!-- Left Copy -->
    <rect x="0" y="0" width="280" height="150" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="20" y="20" width="90" height="18" rx="9" fill="#DCFCE7"/>
    <text x="32" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="bold" fill="#16A34A">Handcrafted in Nepal</text>
    
    <text x="20" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0A192F">Authentic Woolen &amp;</text>
    <text x="20" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="bold" fill="#0A192F">Handmade Crafts</text>
    <text x="20" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">Sourced directly from artisan cooperatives in Pokhara.</text>

    <rect x="20" y="118" width="120" height="26" rx="5" fill="#00A896"/>
    <text x="32" y="135" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">Order on WhatsApp ↗</text>

    <!-- Right Product Showcase -->
    <rect x="295" y="0" width="215" height="150" rx="8" fill="url(#promoGrad)"/>
    <circle cx="402" cy="70" r="45" fill="#FFFFFF" opacity="0.1"/>
    <polygon points="402,35 440,75 365,75" fill="#F5A623"/>
    <rect x="375" y="75" width="55" height="40" rx="4" fill="#00A896"/>
    <text x="340" y="135" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">Himalayan Yak Wool Shawl</text>
  </g>

  <!-- Trust badges & Reviews row -->
  <g transform="translate(45, 270)">
    <rect x="0" y="0" width="160" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="15" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0A192F">⚡ Instant WhatsApp Booking</text>
    <text x="15" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">One-click checkout without</text>
    <text x="15" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">complicated cart steps.</text>

    <rect x="175" y="0" width="160" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="190" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0A192F">💳 eSewa &amp; Khalti Ready</text>
    <text x="190" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">Seamless local payment</text>
    <text x="190" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">links and cash on delivery.</text>

    <rect x="350" y="0" width="160" height="85" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="365" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0A192F">🚀 99+ Mobile Performance</text>
    <text x="365" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">Loads under 1.2s on</text>
    <text x="365" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" fill="#64748B">Nepali mobile 4G networks.</text>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(420, 340)">
    <rect width="135" height="22" rx="4" fill="#0A192F" opacity="0.9"/>
    <text x="12" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F5A623">★ Sample Concept</text>
  </g>
</svg>
