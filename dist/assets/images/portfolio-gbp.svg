<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowP4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#F8FAFC" rx="16"/>

  <!-- Main Card -->
  <rect x="25" y="25" width="550" height="350" rx="12" fill="#FFFFFF" filter="url(#shadowP4)"/>

  <!-- Top Google Search bar style -->
  <rect x="25" y="25" width="550" height="50" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="45" y="37" width="400" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- Google colors dots / search icon -->
  <circle cx="65" cy="50" r="5" fill="#4285F4"/>
  <text x="80" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#334155">digital services near me lalitpur</text>

  <!-- Left: Google Business Profile Info Card -->
  <g transform="translate(45, 90)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0A192F">Local Business Profile Setup</text>
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" fill="#00A896" font-weight="600">Digital Services Provider • Verified Listing Concept</text>
    
    <!-- Stars rating -->
    <g transform="translate(0, 48)">
      <text x="0" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0A192F">5.0</text>
      <text x="26" y="14" font-size="12" fill="#F59E0B">★★★★★</text>
      <text x="86" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">(Demonstration preview)</text>
    </g>

    <!-- Overview / Services / Reviews Tabs -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="70" height="20" rx="10" fill="#0A192F"/>
      <text x="12" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">OVERVIEW</text>

      <rect x="76" y="0" width="65" height="20" rx="10" fill="#F1F5F9"/>
      <text x="88" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">SERVICES</text>

      <rect x="147" y="0" width="65" height="20" rx="10" fill="#F1F5F9"/>
      <text x="160" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" fill="#64748B">REVIEWS</text>
    </g>

    <!-- Location details -->
    <g transform="translate(0, 110)">
      <text x="0" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#1E293B">📍 Lalitpur, Bagmati Province, Nepal</text>
      <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B">🕒 Open: Sun - Fri (9:00 AM - 6:00 PM)</text>
      <text x="0" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#64748B">📞 Direct WhatsApp Support Enabled</text>
      <text x="0" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#00A896">🌐 Linked to Official Custom Website</text>
    </g>

    <!-- Action buttons row: Call, Directions, Website -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="75" height="28" rx="6" fill="#0A192F"/>
      <text x="14" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">📞 Call</text>

      <rect x="85" y="0" width="95" height="28" rx="6" fill="#00A896"/>
      <text x="96" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF">📍 Directions</text>

      <rect x="190" y="0" width="90" height="28" rx="6" fill="#F5A623"/>
      <text x="202" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#0A192F">🌐 Website</text>
    </g>
  </g>

  <!-- Right: Simulated Google Map Preview -->
  <g transform="translate(345, 90)">
    <rect x="0" y="0" width="205" height="230" rx="10" fill="url(#mapGrad)" stroke="#CBD5E1"/>
    
    <!-- Roads on map -->
    <path d="M 0 60 Q 90 80 205 50" stroke="#FFFFFF" stroke-width="8" fill="none"/>
    <path d="M 110 0 L 105 230" stroke="#FFFFFF" stroke-width="10" fill="none"/>
    <path d="M 40 160 Q 120 140 205 180" stroke="#FFFFFF" stroke-width="6" fill="none"/>
    <path d="M 0 110 L 205 120" stroke="#FED7AA" stroke-width="4" fill="none"/>
    
    <!-- Green parks -->
    <rect x="20" y="15" width="45" height="35" rx="6" fill="#DCFCE7"/>
    <rect x="135" y="80" width="55" height="40" rx="6" fill="#DCFCE7"/>

    <!-- Map Pin marker -->
    <circle cx="107" cy="110" r="18" fill="#EF4444" opacity="0.25"/>
    <path d="M 107 92 C 101 92 97 96 97 102 C 97 109 107 122 107 122 C 107 122 117 109 117 102 C 117 96 113 92 107 92 Z" fill="#EF4444"/>
    <circle cx="107" cy="101" r="3.5" fill="#FFFFFF"/>

    <!-- Label popup on map -->
    <rect x="35" y="130" width="140" height="26" rx="4" fill="#0A192F" opacity="0.92"/>
    <text x="44" y="147" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">📍 Suraj Digital Concept</text>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(420, 340)">
    <rect width="135" height="22" rx="4" fill="#0A192F" opacity="0.9"/>
    <text x="12" y="15" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#F5A623">★ Sample Concept</text>
  </g>
</svg>
